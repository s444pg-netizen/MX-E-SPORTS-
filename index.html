<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX E-SPORTS | FF Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20">
    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-black text-yellow-500 tracking-wider">MX E-SPORTS</h1>
            <p class="text-xs text-gray-400">Official Free Fire Arena</p>
        </div>
        <button onclick="openWalletModal()" class="bg-gray-800 border border-yellow-500/40 px-3 py-1.5 rounded-full text-xs font-bold text-yellow-400 flex items-center gap-1.5">
            <span>💰 वॉलेट</span>
        </button>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-800 bg-gray-900/50 text-xs font-bold text-center">
        <button onclick="switchTab('matches')" id="tabMatches" class="flex-1 py-3 border-b-2 border-yellow-500 text-yellow-500">🏆 टूर्नामेंट्स</button>
        <button onclick="switchTab('results')" id="tabResults" class="flex-1 py-3 text-gray-400">📜 रिजल्ट्स (Winners)</button>
    </div>

    <!-- Tab 1: Matches -->
    <main id="matchesTabContent" class="max-w-md mx-auto p-4 space-y-4">
        <div id="userMatchesList" class="space-y-4">
            <p class="text-gray-500 text-center py-6 text-sm">लोड हो रहा है...</p>
        </div>
    </main>

    <!-- Tab 2: Results -->
    <main id="resultsTabContent" class="max-w-md mx-auto p-4 space-y-4 hidden">
        <div id="resultsList" class="space-y-3"></div>
    </main>

    <!-- Join Modal -->
    <div id="joinModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs space-y-3">
            <h3 class="font-bold text-yellow-400">मैच में एंट्री लें</h3>
            <input id="playerName" type="text" placeholder="Free Fire Game Name (IGN)" class="w-full p-2.5 rounded bg-gray-800 border border-gray-700 text-sm focus:outline-none">
            <input id="playerUid" type="text" placeholder="Free Fire UID" class="w-full p-2.5 rounded bg-gray-800 border border-gray-700 text-sm focus:outline-none">
            <div class="flex gap-2 pt-2">
                <button onclick="confirmJoin()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded text-sm">जॉइन कन्फर्म</button>
                <button onclick="closeModal('joinModal')" class="flex-1 bg-gray-800 text-white py-2 rounded text-sm">कैंसिल</button>
            </div>
        </div>
    </div>

    <!-- Wallet / Add Money Modal -->
    <div id="walletModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs space-y-3">
            <h3 class="font-bold text-yellow-400 text-base">💰 वॉलेट रिचार्ज (Add Money)</h3>
            <div class="bg-gray-800 p-3 rounded-xl text-center space-y-1">
                <p class="text-xs text-gray-400">UPI आईडी पर पेमेंट करें:</p>
                <p class="font-mono text-sm text-yellow-400 font-bold select-all">aapka-upi-id@okaxis</p>
            </div>
            <input id="depositUser" type="text" placeholder="अपना नाम" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-xs">
            <input id="depositUid" type="text" placeholder="Free Fire UID" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-xs">
            <input id="depositAmount" type="number" placeholder="पेमेंट अमाउंट (₹)" class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-xs">
            <input id="depositUtr" type="text" placeholder="12 डिजिट UTR / Ref No." class="w-full p-2 rounded bg-gray-800 border border-gray-700 text-xs">
            <div class="flex gap-2 pt-2">
                <button onclick="submitDeposit()" class="flex-1 bg-green-600 text-white font-bold py-2 rounded text-xs">रिक्वेस्ट भेजें</button>
                <button onclick="closeModal('walletModal')" class="flex-1 bg-gray-800 text-white py-2 rounded text-xs">बंद करें</button>
            </div>
        </div>
    </div>

    <script>
        // अपना Firebase Config यहाँ पेस्ट करें
        const firebaseConfig = {
            apiKey: "1:490438093989:web:45311a4b2cbe6f6f4b714c",
            databaseURL: "https://mx-e-sports-82b3d-default-rtdb.firebaseio.com",
            projectId: "mx-e-sports-82b3d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeMatchId = null;

        function switchTab(tab) {
            if(tab === 'matches') {
                document.getElementById('matchesTabContent').classList.remove('hidden');
                document.getElementById('resultsTabContent').classList.add('hidden');
                document.getElementById('tabMatches').className = "flex-1 py-3 border-b-2 border-yellow-500 text-yellow-500 font-bold";
                document.getElementById('tabResults').className = "flex-1 py-3 text-gray-400 font-bold";
            } else {
                document.getElementById('matchesTabContent').classList.add('hidden');
                document.getElementById('resultsTabContent').classList.remove('hidden');
                document.getElementById('tabResults').className = "flex-1 py-3 border-b-2 border-yellow-500 text-yellow-500 font-bold";
                document.getElementById('tabMatches').className = "flex-1 py-3 text-gray-400 font-bold";
            }
        }

        // Load Matches & Slots Live
        db.ref('matches').on('value', snapshot => {
            const container = document.getElementById('userMatchesList');
            const resContainer = document.getElementById('resultsList');
            container.innerHTML = '';
            resContainer.innerHTML = '';
            const data = snapshot.val();
            if(!data) {
                container.innerHTML = '<p class="text-gray-500 text-center py-6 text-sm">अभी कोई मैच लाइव नहीं है।</p>';
                return;
            }

            for(let id in data) {
                const m = data[id];

                // If completed, add to results
                if(m.status === 'completed' || m.winner) {
                    resContainer.innerHTML += `
                        <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 shadow">
                            <h4 class="font-bold text-white text-sm">${m.title}</h4>
                            <p class="text-xs text-gray-400">समय: ${m.time} | प्राइज: ₹${m.prize}</p>
                            <div class="mt-2 bg-yellow-500/10 border border-yellow-500/30 p-2 rounded text-xs flex justify-between items-center">
                                <span class="text-gray-300">👑 Winner:</span>
                                <span class="font-bold text-yellow-400">${m.winner}</span>
                            </div>
                        </div>
                    `;
                }

                // If upcoming, show in matches
                if(m.status !== 'completed') {
                    db.ref('participants/' + id).once('value', pSnap => {
                        const joined = pSnap.numChildren();
                        container.innerHTML += `
                            <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-lg">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-white text-base">${m.title}</h3>
                                    <span class="bg-orange-500/20 text-orange-400 text-xs px-2 py-0.5 rounded font-bold">फीस: ₹${m.fee}</span>
                                </div>
                                <p class="text-xs text-gray-400 mb-2">⏰ समय: ${m.time} | 🎁 प्राइज: ₹${m.prize}</p>
                                
                                <div class="w-full bg-gray-800 rounded-full h-2 mb-3">
                                    <div class="bg-yellow-500 h-2 rounded-full" style="width: ${(joined / m.slots) * 100}%"></div>
                                </div>
                                <p class="text-xs text-gray-400 mb-3 text-right">स्लॉट्स: <span class="text-yellow-400 font-bold">${joined}/${m.slots}</span></p>

                                <div class="bg-gray-800/80 p-2.5 rounded-lg border border-gray-700/60 mb-3 text-xs">
                                    <p class="text-gray-400 font-semibold mb-1">🎮 कस्टम रूम क्रेडेंशियल्स:</p>
                                    <p class="text-green-400">Room ID: <span class="font-mono text-white select-all font-bold">${m.roomId || 'मैच से 15 मिनट पहले आएगी'}</span></p>
                                    <p class="text-green-400">Password: <span class="font-mono text-white select-all font-bold">${m.roomPass || 'मैच से 15 मिनट पहले आएगा'}</span></p>
                                </div>

                                <button onclick="openJoinModal('${id}')" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-black font-bold py-2 rounded-lg text-sm hover:opacity-90">
                                    जॉइन करें (₹${m.fee})
                                </button>
                            </div>
                        `;
                    });
                }
            }
        });

        function openJoinModal(id) {
            activeMatchId = id;
            document.getElementById('joinModal').classList.remove('hidden');
            document.getElementById('joinModal').classList.add('flex');
        }

        function openWalletModal() {
            document.getElementById('walletModal').classList.remove('hidden');
            document.getElementById('walletModal').classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function confirmJoin() {
            const name = document.getElementById('playerName').value;
            const uid = document.getElementById('playerUid').value;
            if(!name || !uid) return alert('UID और नाम दोनों भरें!');

            db.ref('participants/' + activeMatchId).push({ name, uid, time: Date.now() })
                .then(() => {
                    alert('सफलतापूर्वक जॉइन हो गए!');
                    closeModal('joinModal');
                });
        }

        function submitDeposit() {
            const userName = document.getElementById('depositUser').value;
            const uid = document.getElementById('depositUid').value;
            const amount = document.getElementById('depositAmount').value;
            const utr = document.getElementById('depositUtr').value;

            if(!userName || !amount || !utr) return alert('सभी जानकारी भरें!');

            db.ref('deposits').push({ userName, uid, amount, utr, status: 'pending', time: Date.now() })
                .then(() => {
                    alert('रिक्वेस्ट सबमिट हो गई! एडमिन जल्द ही चेक करके अप्रूव करेगा।');
                    closeModal('walletModal');
                });
        }
    </script>
</body>
    </html>
