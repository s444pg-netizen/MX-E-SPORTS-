<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX E-SPORTS | FF Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-20 font-sans">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
        <div>
            <h1 class="text-xl font-black text-yellow-500 tracking-wider">MX E-SPORTS</h1>
            <p class="text-[11px] text-gray-400">Official Free Fire Arena</p>
        </div>
        <button onclick="openWalletModal()" class="bg-gradient-to-r from-yellow-500 to-orange-500 text-black px-3.5 py-1.5 rounded-full text-xs font-black flex items-center gap-1 shadow-md hover:opacity-90 transition">
            <span>💰 वॉलेट / विड्रॉल</span>
        </button>
    </header>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-gray-800 bg-gray-900/60 text-xs font-bold text-center">
        <button onclick="switchTab('matches')" id="tabMatches" class="flex-1 py-3 border-b-2 border-yellow-500 text-yellow-500">🏆 लाइव टूर्नामेंट्स</button>
        <button onclick="switchTab('results')" id="tabResults" class="flex-1 py-3 text-gray-400">📜 रिजल्ट्स (Winners)</button>
    </div>

    <!-- Tab 1: Matches Section -->
    <main id="matchesTabContent" class="max-w-md mx-auto p-4 space-y-4">
        <div id="userMatchesList" class="space-y-4">
            <p class="text-gray-500 text-center py-8 text-sm animate-pulse">मैचेस लोड हो रहे हैं...</p>
        </div>
    </main>

    <!-- Tab 2: Results Section -->
    <main id="resultsTabContent" class="max-w-md mx-auto p-4 space-y-4 hidden">
        <div id="resultsList" class="space-y-3">
            <p class="text-gray-500 text-center py-6 text-sm">अभी कोई रिजल्ट नहीं है।</p>
        </div>
    </main>

    <!-- Join Tournament Modal -->
    <div id="joinModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs space-y-3 shadow-2xl">
            <h3 class="font-bold text-yellow-400 text-base">मैच में एंट्री लें</h3>
            <input id="playerName" type="text" placeholder="Free Fire Game Name (IGN)" class="w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-sm focus:outline-none focus:border-yellow-500 text-white">
            <input id="playerUid" type="text" placeholder="Free Fire UID (नंबर)" class="w-full p-2.5 rounded-lg bg-gray-800 border border-gray-700 text-sm focus:outline-none focus:border-yellow-500 text-white">
            <div class="flex gap-2 pt-2">
                <button onclick="confirmJoin()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded-lg text-sm hover:bg-yellow-600">जॉइन कन्फर्म</button>
                <button onclick="closeModal('joinModal')" class="flex-1 bg-gray-800 text-white py-2 rounded-lg text-sm hover:bg-gray-700">कैंसिल</button>
            </div>
        </div>
    </div>

    <!-- Wallet Modal (Add Money + Withdraw) -->
    <div id="walletModal" class="fixed inset-0 bg-black/85 hidden items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs space-y-3 shadow-2xl my-auto">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 class="font-bold text-yellow-400 text-base">💰 वॉलेट सेंटर</h3>
                <button onclick="closeModal('walletModal')" class="text-gray-400 hover:text-white font-bold text-lg">&times;</button>
            </div>

            <!-- Wallet Sub Tabs -->
            <div class="flex bg-gray-800 p-1 rounded-xl text-xs font-bold text-center gap-1">
                <button onclick="toggleWalletView('deposit')" id="btnDep" class="flex-1 py-1.5 rounded-lg bg-yellow-500 text-black">➕ Add Money</button>
                <button onclick="toggleWalletView('withdraw')" id="btnWth" class="flex-1 py-1.5 rounded-lg text-gray-400 hover:text-white">💸 Withdraw</button>
            </div>

            <!-- 1. Add Money Section -->
            <div id="depositSection" class="space-y-3">
                <div class="bg-gray-800/80 p-3 rounded-xl text-center space-y-2 flex flex-col items-center border border-gray-700/60">
                    <p class="text-xs text-gray-300 font-semibold">QR कोड स्कैन करके पेमेंट करें:</p>
                    <img src="qr.png" alt="UPI QR Code" class="w-36 h-36 rounded-lg border-2 border-yellow-500 p-1 bg-white shadow mx-auto">
                    <p class="text-[10px] text-gray-400">PhonePe / Google Pay / Paytm</p>
                </div>

                <div class="space-y-2">
                    <input id="depositUser" type="text" placeholder="अपना नाम" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <input id="depositUid" type="text" placeholder="Free Fire UID" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <input id="depositAmount" type="number" placeholder="पेमेंट अमाउंट (₹)" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <input id="depositUtr" type="text" placeholder="12-अंकों का UTR / Ref No." class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <button onclick="submitDeposit()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg text-xs transition">ऐड मनी रिक्वेस्ट भेजें</button>
                </div>
            </div>

            <!-- 2. Withdraw Section -->
            <div id="withdrawSection" class="space-y-3 hidden">
                <div class="bg-gray-800/60 p-3 rounded-xl border border-gray-700/60 text-xs text-gray-300 space-y-1">
                    <p class="text-yellow-400 font-bold">⚠️ विड्रॉल नियम:</p>
                    <p>• जीती हुई राशि 2 घंटे में ट्रांसफर होगी।</p>
                    <p>• अपना सही UPI ID या PhonePe नंबर डालें।</p>
                </div>

                <div class="space-y-2">
                    <input id="wthUser" type="text" placeholder="अपना नाम" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <input id="wthUid" type="text" placeholder="Free Fire UID" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <input id="wthAmount" type="number" placeholder="विड्रॉल अमाउंट (₹)" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white">
                    <input id="wthUpi" type="text" placeholder="अपनी UPI ID (उदा: 9876543210@paytm)" class="w-full p-2 rounded-lg bg-gray-800 border border-gray-700 text-xs text-white font-mono">
                    <button onclick="submitWithdraw()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-2 rounded-lg text-xs transition">विड्रॉल रिक्वेस्ट सबमिट करें</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // अपना FIREBASE CONFIG यहाँ डालें
        const firebaseConfig = {
            apiKey: "1:490438093989:web:45311a4b2cbe6f6f4b714c",
            databaseURL: "https://mx-e-sports-82b3d-default-rtdb.firebaseio.com",
            projectId: "mx-e-sports-82b3d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeMatchId = null;

        function switchTab(tab) {
            if(tab === 'matches') {
                document.getElementById('matchesTabContent').classList.remove('hidden');
                document.getElementById('resultsTabContent').classList.add('hidden');
                document.getElementById('tabMatches').className = "flex-1 py-3 border-b-2 border-yellow-500 text-yellow-500 font-bold";
                document.getElementById('tabResults').className = "flex-1 py-3 text-gray-400 font-bold";
            } else {
                document.getElementById('matchesTabContent').classList.add('hidden');
                document.getElementById('resultsTabContent').classList.remove('hidden');
                document.getElementById('tabResults').className = "flex-1 py-3 border-b-2 border-yellow-500 text-yellow-500 font-bold";
                document.getElementById('tabMatches').className = "flex-1 py-3 text-gray-400 font-bold";
            }
        }

        function toggleWalletView(view) {
            if(view === 'deposit') {
                document.getElementById('depositSection').classList.remove('hidden');
                document.getElementById('withdrawSection').classList.add('hidden');
                document.getElementById('btnDep').className = "flex-1 py-1.5 rounded-lg bg-yellow-500 text-black font-bold";
                document.getElementById('btnWth').className = "flex-1 py-1.5 rounded-lg text-gray-400 hover:text-white font-bold";
            } else {
                document.getElementById('depositSection').classList.add('hidden');
                document.getElementById('withdrawSection').classList.remove('hidden');
                document.getElementById('btnWth').className = "flex-1 py-1.5 rounded-lg bg-yellow-500 text-black font-bold";
                document.getElementById('btnDep').className = "flex-1 py-1.5 rounded-lg text-gray-400 hover:text-white font-bold";
            }
        }

        db.ref('matches').on('value', snapshot => {
            const container = document.getElementById('userMatchesList');
            const resContainer = document.getElementById('resultsList');
            container.innerHTML = '';
            resContainer.innerHTML = '';
            const data = snapshot.val();
            if(!data) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8 text-sm">अभी कोई मैच लाइव नहीं है।</p>';
                return;
            }

            for(let id in data) {
                const m = data[id];

                if(m.status === 'completed' || m.winner) {
                    resContainer.innerHTML += `
                        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-lg">
                            <h4 class="font-bold text-white text-base">${m.title}</h4>
                            <p class="text-xs text-gray-400 mb-2">समय: ${m.time} | प्राइज: ₹${m.prize}</p>
                            <div class="bg-yellow-500/10 border border-yellow-500/30 p-2.5 rounded-lg text-xs flex justify-between items-center">
                                <span class="text-gray-300 font-semibold">👑 Booyah Winner:</span>
                                <span class="font-black text-yellow-400 text-sm">${m.winner}</span>
                            </div>
                        </div>
                    `;
                }

                if(m.status !== 'completed') {
                    db.ref('participants/' + id).on('value', pSnap => {
                        const joined = pSnap.numChildren();
                        const percent = Math.min((joined / m.slots) * 100, 100);
                        container.innerHTML += `
                            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-xl">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-white text-base">${m.title}</h3>
                                    <span class="bg-orange-500/20 text-orange-400 text-xs px-2.5 py-0.5 rounded-full font-black border border-orange-500/30">फीस: ₹${m.fee}</span>
                                </div>
                                <p class="text-xs text-gray-400 mb-3">⏰ समय: ${m.time} | 🎁 प्राइज: ₹${m.prize}</p>
                                
                                <div class="w-full bg-gray-800 rounded-full h-2 mb-1.5 overflow-hidden">
                                    <div class="bg-yellow-500 h-2 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                                </div>
                                <p class="text-[11px] text-gray-400 mb-3 text-right">स्लॉट्स: <span class="text-yellow-400 font-bold">${joined}/${m.slots}</span></p>

                                <div class="bg-gray-800/80 p-3 rounded-xl border border-gray-700/60 mb-3 text-xs space-y-1">
                                    <p class="text-gray-400 font-bold mb-1">🎮 कस्टम रूम क्रेडेंशियल्स:</p>
                                    <p class="text-green-400">Room ID: <span class="font-mono text-white select-all font-bold">${m.roomId || 'मैच से 15 मिनट पहले आएगी'}</span></p>
                                    <p class="text-green-400">Password: <span class="font-mono text-white select-all font-bold">${m.roomPass || 'मैच से 15 मिनट पहले आएगा'}</span></p>
                                </div>

                                <button onclick="openJoinModal('${id}')" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-black font-black py-2.5 rounded-xl text-sm hover:opacity-90 shadow-md">
                                    जॉइन करें (₹${m.fee})
                                </button>
                            </div>
                        `;
                    });
                }
            }
        });

        function openJoinModal(id) {
            activeMatchId = id;
            document.getElementById('joinModal').classList.remove('hidden');
            document.getElementById('joinModal').classList.add('flex');
        }

        function openWalletModal() {
            document.getElementById('walletModal').classList.remove('hidden');
            document.getElementById('walletModal').classList.add('flex');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function confirmJoin() {
            const name = document.getElementById('playerName').value;
            const uid = document.getElementById('playerUid').value;
            if(!name || !uid) return alert('UID और IGN दोनों भरें!');

            db.ref('participants/' + activeMatchId).push({ name, uid, time: Date.now() })
                .then(() => {
                    alert('सफलतापूर्वक मैच में जॉइन हो गए!');
                    closeModal('joinModal');
                });
        }

        function submitDeposit() {
            const userName = document.getElementById('depositUser').value;
            const uid = document.getElementById('depositUid').value;
            const amount = document.getElementById('depositAmount').value;
            const utr = document.getElementById('depositUtr').value;

            if(!userName || !amount || !utr) return alert('सभी जानकारी भरें!');

            db.ref('deposits').push({ userName, uid, amount, utr, status: 'pending', time: Date.now() })
                .then(() => {
                    alert('ऐड मनी रिक्वेस्ट सबमिट हो गई! एडमिन जल्द ही चेक करके अप्रूव करेगा।');
                    closeModal('walletModal');
                });
        }

        function submitWithdraw() {
            const userName = document.getElementById('wthUser').value;
            const uid = document.getElementById('wthUid').value;
            const amount = document.getElementById('wthAmount').value;
            const upi = document.getElementById('wthUpi').value;

            if(!userName || !amount || !upi) return alert('सभी जानकारी (नाम, अमाउंट, UPI ID) भरें!');

            db.ref('withdrawals').push({ userName, uid, amount, upi, status: 'pending', time: Date.now() })
                .then(() => {
                    alert('विड्रॉल रिक्वेस्ट सबमिट हो गई! एडमिन आपके UPI पर पैसे ट्रांसफर कर देगा।');
                    closeModal('walletModal');
                });
        }
    </script>
</body>
                        </html>
