<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX E-SPORTS - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-yellow-500 mb-6 text-center">🔥 MX E-SPORTS ADMIN PANEL</h1>

        <!-- Create Tournament Form -->
        <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 mb-8 shadow-lg">
            <h2 class="text-xl font-semibold mb-4 text-orange-400">➕ नया मैच बनाएँ</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="title" type="text" placeholder="मैच का नाम (उदा: Solo Bermuda)" class="p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none">
                <input id="time" type="text" placeholder="तारीख और समय (उदा: Today 8:00 PM)" class="p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none">
                <input id="fee" type="number" placeholder="एंट्री फीस (₹)" class="p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none">
                <input id="prize" type="number" placeholder="प्राइज पूल (₹)" class="p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none">
                <input id="slots" type="number" placeholder="टोटल स्लॉट्स (उदा: 48)" class="p-2.5 rounded bg-gray-700 border border-gray-600 focus:outline-none">
                <button onclick="createMatch()" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2.5 rounded transition">मैच पब्लिश करें</button>
            </div>
        </div>

        <!-- Matches List with Room ID Management -->
        <h2 class="text-xl font-semibold mb-4 text-orange-400">📊 लाइव / अपकमिंग मैचेस</h2>
        <div id="matchesList" class="space-y-4">
            <!-- Matches will load here dynamically -->
        </div>
    </div>

    <script>
        // अपना Firebase कॉन्फिग यहाँ पेस्ट करें
        const firebaseConfig = {
            apiKey: "1:490438093989:web:45311a4b2cbe6f6f4b714c",
            databaseURL: "https://mx-e-sports-82b3d-default-rtdb.firebaseio.com",
            projectId: "mx-e-sports-82b3d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function createMatch() {
            const title = document.getElementById('title').value;
            const time = document.getElementById('time').value;
            const fee = document.getElementById('fee').value;
            const prize = document.getElementById('prize').value;
            const slots = document.getElementById('slots').value;

            if(!title || !time || !fee || !prize) return alert('सभी जानकारी भरें!');

            const matchRef = db.ref('matches').push();
            matchRef.set({
                id: matchRef.key,
                title, time, fee, prize, slots,
                joined: 0,
                roomId: "",
                roomPass: ""
            }).then(() => {
                alert('मैच सफलतापूर्वक बन गया!');
                location.reload();
            });
        }

        db.ref('matches').on('value', snapshot => {
            const container = document.getElementById('matchesList');
            container.innerHTML = '';
            const data = snapshot.val();
            if(!data) return container.innerHTML = '<p class="text-gray-500">कोई मैच नहीं है।</p>';

            for(let id in data) {
                const m = data[id];
                container.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h3 class="font-bold text-lg text-yellow-400">${m.title}</h3>
                            <p class="text-sm text-gray-400">समय: ${m.time} | फीस: ₹${m.fee} | प्राइज: ₹${m.prize}</p>
                            <p class="text-xs text-green-400">रूम आईडी: ${m.roomId || 'अभी नहीं दी गई'} | पासवर्ड: ${m.roomPass || 'N/A'}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <input id="rid_${id}" type="text" placeholder="Room ID" value="${m.roomId || ''}" class="p-1.5 text-sm bg-gray-700 rounded w-24">
                            <input id="rpass_${id}" type="text" placeholder="Pass" value="${m.roomPass || ''}" class="p-1.5 text-sm bg-gray-700 rounded w-20">
                            <button onclick="updateRoom('${id}')" class="bg-green-600 px-3 py-1.5 rounded text-sm font-semibold hover:bg-green-700">अपडेट</button>
                            <button onclick="deleteMatch('${id}')" class="bg-red-600 px-3 py-1.5 rounded text-sm font-semibold hover:bg-red-700">हटाएँ</button>
                        </div>
                    </div>
                `;
            }
        });

        function updateRoom(id) {
            const roomId = document.getElementById('rid_' + id).value;
            const roomPass = document.getElementById('rpass_' + id).value;
            db.ref('matches/' + id).update({ roomId, roomPass })
                .then(() => alert('Room ID और पासवर्ड अपडेट हो गया!'));
        }

        function deleteMatch(id) {
            if(confirm('क्या आप सच में यह मैच हटाना चाहते हैं?')) {
                db.ref('matches/' + id).remove();
            }
        }
    </script>
</body>
</html>
