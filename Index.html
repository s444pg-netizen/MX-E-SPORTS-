<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Arena - MX E-SPORTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen pb-16">
    <!-- Header -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black text-yellow-500 tracking-wider">MX E-SPORTS</h1>
            <p class="text-xs text-gray-400">FF Arena Tournaments</p>
        </div>
        <div class="bg-gray-800 border border-yellow-500/30 px-3 py-1 rounded-full text-xs font-semibold text-yellow-400">
            💰 वॉलेट: ₹0
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <h2 class="text-lg font-bold text-orange-400">🏆 अपकमिंग टूर्नामेंट</h2>
        <div id="userMatchesList" class="space-y-4">
            <p class="text-gray-500 text-center py-8">लोड हो रहा है...</p>
        </div>
    </main>

    <!-- Join Modal -->
    <div id="joinModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-gray-900 border border-gray-700 p-5 rounded-2xl w-full max-w-xs space-y-4">
            <h3 class="font-bold text-yellow-400">मैच जॉइन करें</h3>
            <input id="playerName" type="text" placeholder="अपना Free Fire गेम नाम (IGN)" class="w-full p-2.5 rounded bg-gray-800 border border-gray-700 text-sm">
            <input id="playerUid" type="text" placeholder="Free Fire UID" class="w-full p-2.5 rounded bg-gray-800 border border-gray-700 text-sm">
            <div class="flex gap-2">
                <button onclick="confirmJoin()" class="flex-1 bg-yellow-500 text-black font-bold py-2 rounded text-sm">कन्फर्म जॉइन</button>
                <button onclick="closeModal()" class="flex-1 bg-gray-700 text-white py-2 rounded text-sm">रद्द करें</button>
            </div>
        </div>
    </div>

    <script>
        // वही सेम Firebase कॉन्फिग यहाँ भी डालें
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let activeMatchId = null;

        db.ref('matches').on('value', snapshot => {
            const container = document.getElementById('userMatchesList');
            container.innerHTML = '';
            const data = snapshot.val();
            if(!data) return container.innerHTML = '<p class="text-gray-500 text-center">अभी कोई मैच लाइव नहीं है।</p>';

            for(let id in data) {
                const m = data[id];
                container.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 shadow-lg">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-white text-base">${m.title}</h3>
                            <span class="bg-orange-500/20 text-orange-400 text-xs px-2 py-0.5 rounded font-medium">फीस: ₹${m.fee}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-3">⏰ समय: ${m.time} | 🎁 प्राइज पूल: ₹${m.prize}</p>
                        
                        <!-- Room Details Box -->
                        <div class="bg-gray-800/60 p-2.5 rounded-lg border border-gray-700/50 mb-3 text-xs">
                            <p class="text-gray-400 font-semibold mb-1">🎮 रूम क्रेडेंशियल्स:</p>
                            <p class="text-green-400">ID: <span class="font-mono text-white">${m.roomId || 'मैच से 15 मिनट पहले आएगी'}</span></p>
                            <p class="text-green-400">Password: <span class="font-mono text-white">${m.roomPass || 'मैच से 15 मिनट पहले आएगा'}</span></p>
                        </div>

                        <button onclick="openJoinModal('${id}')" class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-black font-bold py-2 rounded-lg text-sm hover:opacity-90">
                            जॉइन करें (₹${m.fee})
                        </button>
                    </div>
                `;
            }
        });

        function openJoinModal(id) {
            activeMatchId = id;
            document.getElementById('joinModal').classList.remove('hidden');
            document.getElementById('joinModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('joinModal').classList.add('hidden');
            document.getElementById('joinModal').classList.remove('flex');
        }

        function confirmJoin() {
            const name = document.getElementById('playerName').value;
            const uid = document.getElementById('playerUid').value;
            if(!name || !uid) return alert('UID और नाम दोनों भरें!');

            db.ref('participants/' + activeMatchId).push({ name, uid, time: Date.now() })
                .then(() => {
                    alert('सफलतापूर्वक जॉइन हो गए! रूम आईडी यहीं पर दिखेगी।');
                    closeModal();
                });
        }
    </script>
</body>
              </html>
